<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дурак Онлайн</title>
    <style>
        body { font-family: sans-serif; background: #2d5a27; color: white; margin: 0; padding: 10px; }
        .card { display: inline-block; background: white; color: black; padding: 8px 12px; margin: 3px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 18px; user-select: none; }
        .card.red { color: #cc0000; }
        .card.selected { border: 3px solid gold; }
        .card.back { background: #1a3a6b; color: transparent; }
        .section { margin: 10px 0; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px; }
        button { padding: 12px 20px; margin: 5px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; }
        .btn-primary { background: #4CAF50; color: white; }
        .btn-warn { background: #ff9800; color: white; }
        #log { font-size: 12px; color: #ccc; margin-top: 10px; }
        #table { min-height: 60px; }
    </style>
</head>
<body>
    <h2>Дурак (Переводной)</h2>
    <div id="lobby">
        <button class="btn-primary" onclick="createRoom()">Создать комнату</button>
        <input id="roomInput" placeholder="Код комнаты" style="padding:10px; font-size:16px; width:120px;">
        <button class="btn-primary" onclick="joinRoom()">Войти</button>
    </div>
    
    <div id="game" style="display:none;">
        <div class="section">
            <div>Козырь: <span id="trump"></span> | В колоде: <span id="deckCount"></span></div>
            <div>Противник: <span id="oppCount"></span> карт</div>
        </div>
        <div class="section" id="table">
            <strong>Стол:</strong> <span id="tableCards"></span>
        </div>
        <div class="section">
            <strong>Твои карты:</strong>
            <div id="hand"></div>
        </div>
        <div>
            <button class="btn-warn" onclick="sendAction('pass')">Пас / Бито / Взять</button>
        </div>
        <div id="log"></div>
    </div>

    <script>
        let ws;
        let myHand = [];
        let selectedCard = null;
        
        function connect() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(protocol + '//' + location.host);
            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.type === 'created') {
                    document.getElementById('lobby').innerHTML = '<h3>Комната: ' + data.roomId + '</h3><p>Скинь код другу</p>';
                }
                if (data.type === 'state') {
                    document.getElementById('lobby').style.display = 'none';
                    document.getElementById('game').style.display = 'block';
                    renderState(data);
                }
                if (data.type === 'error') {
                    alert(data.message);
                }
            };
        }
        
        function createRoom() {
            connect();
            ws.onopen = () => ws.send(JSON.stringify({ type: 'create' }));
        }
        
        function joinRoom() {
            const id = document.getElementById('roomInput').value.trim().toUpperCase();
            connect();
            ws.onopen = () => ws.send(JSON.stringify({ type: 'join', roomId: id }));
        }
        
        function renderState(s) {
            myHand = s.hand;
            document.getElementById('trump').textContent = s.trump;
            document.getElementById('deckCount').textContent = s.deckCount;
            document.getElementById('oppCount').textContent = s.opponentCount;
            
            let tableHtml = '';
            s.table.forEach((t, i) => {
                tableHtml += `<span class="card">${t.attack.suit}${t.attack.rank}</span>`;
                if (t.defend) tableHtml += `<span class="card">${t.defend.suit}${t.defend.rank}</span>`;
                else tableHtml += ` <span style="color:yellow">←</span> `;
            });
            document.getElementById('tableCards').innerHTML = tableHtml || 'Пусто';
            
            const handDiv = document.getElementById('hand');
            handDiv.innerHTML = '';
            myHand.forEach(c => {
                const span = document.createElement('span');
                span.className = 'card' + (c.suit === '♥' || c.suit === '♦' ? ' red' : '');
                span.textContent = c.suit + c.rank;
                span.onclick = () => {
                    document.querySelectorAll('.card.selected').forEach(el => el.classList.remove('selected'));
                    span.classList.add('selected');
                    selectedCard = c;
                };
                handDiv.appendChild(span);
            });
        }
        
        function sendAction(action) {
            if (action === 'pass') {
                ws.send(JSON.stringify({ type: 'pass' }));
                return;
            }
        }
        
        // Simplified: clicking a card auto-sends as play
        // In real game you'd need more UI for attack vs defend vs translate
        const originalRender = renderState;
        renderState = function(s) {
            originalRender(s);
            // Re-attach click to send play
            document.querySelectorAll('#hand .card').forEach((el, idx) => {
                el.onclick = () => {
                    const card = myHand[idx];
                    ws.send(JSON.stringify({ type: 'play', card: card }));
                };
            });
        };
        
        connect();
    </script>
</body>
</html>
